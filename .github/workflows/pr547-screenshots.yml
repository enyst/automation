name: Capture PR 547 review footers

on:
  push:
    branches:
      - evidence/extensions-pr-547-20261009

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node capture.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: pr547-review-footers
          path: evidence/pr-547/*.jpg
          if-no-files-found: error
